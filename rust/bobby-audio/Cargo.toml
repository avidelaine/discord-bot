[package]
name = "bobby-audio"
version = "0.1.0"
edition = "2021"
description = "PC microphone, wake word, speakers"

[dependencies]
bobby-proto = { workspace = true }
ort = { workspace = true }
rubato = { workspace = true }
cpal = { workspace = true }
hound = "3.5"

[target.'cfg(windows)'.dependencies]
windows = { workspace = true, features = ["Win32_Foundation", "Win32_Media_Audio", "Win32_Media_Multimedia"] }
