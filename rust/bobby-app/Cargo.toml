[package]
name = "bobby-app"
version = "0.1.0"
edition = "2021"
description = "Bobby's desktop control app: supervisor, metrics, journal, tray"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
bobby-proto = { workspace = true }
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-single-instance = "2"
tauri-plugin-autostart = "2"
axum = "0.8"
tokio = { version = "1", features = ["process", "time", "io-util", "net", "sync", "macros", "rt-multi-thread"] }
tokio-stream = { version = "0.1", features = ["sync"] }
futures-util = "0.3"
sysinfo = { version = "0.40", default-features = false, features = ["system"] }
nvml-wrapper = "0.13"
windows = { workspace = true, features = ["Win32_System_Performance"] }
rusqlite = { version = "0.43", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "1"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
bobby-infer = { workspace = true }
bobby-audio = { workspace = true }
bobby-pc = { workspace = true }
bobby-core = { workspace = true }
bobby-discord = { workspace = true }
reqwest = { workspace = true }

[features]
# In-process engines (stt/tts = "local" in bobby.toml); local-stt needs the CUDA toolkit and CMake to build.
local-stt = ["bobby-infer/ct2", "bobby-discord/local-stt"]
local-tts = ["bobby-infer/piper", "bobby-discord/local-tts"]

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
