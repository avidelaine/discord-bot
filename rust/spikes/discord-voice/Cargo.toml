[package]
name = "discord-voice-spike"
version = "0.1.0"
edition = "2024"
publish = false

# Standalone on purpose: not part of any workspace.
[workspace]

[dependencies]
songbird = { version = "0.6.1", features = ["receive"] }
serenity = { version = "0.12.5", default-features = false, features = ["client", "gateway", "voice", "cache", "model", "rustls_backend"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "signal", "time"] }
hound = "3.5"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
# songbird builds symphonia without codecs: the PCM codec decodes the beep (RawAdapter, f32).
symphonia = { version = "0.5", default-features = false, features = ["pcm"] }

